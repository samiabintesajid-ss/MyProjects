<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

    <style>
        h1 {
            color: rgb(0, 0, 0);
            font-family:Georgia, 'Times New Roman', Times, serif 
        }
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 50px;
            background-color: #facdef;
        }
        input {
            width: 400px;
            padding: 10px;
            font-size: 16px;
            BORDER-RADIUS: 10px;
            background-color: rgb(255, 255, 255);
            color: black;
            font-family:Georgia, 'Times New Roman', Times, serif
        }
        .container {
            margin-top: 100px;
            padding: 20px;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 600px;
            margin: 0 auto;
            box-shadow: 0 8px 10px rgba(0, 0, 1, 0.1);
            background: rgba(189, 106, 175, 0.411); 
            backdrop-filter: blur(10px);          
            -webkit-backdrop-filter: blur(10px);  
            border: 1px solid rgba(255, 255, 255, 0.3); 
            border-radius: 15px;
            padding: 20px;
        }
        button {
            padding: 10px 20px;
            cursor: pointer;
            font-size: 16px;
            margin-left: 10px;
            margin-top: 20px;
            border-radius: 10px;
            background-color: rgb(0, 0, 0);
            color: white;
            transition: all 0.3s ease-in;
            border: none;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            align-items: center;
            justify-content: center;
            font-family:Georgia, 'Times New Roman', Times, serif 
        }    
        button:hover {
            background-color: rgb(255, 255, 255);
            color: black;
            transform: scale(1.5);
        }
        </style>
</head>
<body>
     <Div class="container">
    <h1>Random Password Generator</h1>
    <input type="text" id="password" readonly placeholder="Your generated password will appear here">
    <button data-aos="zoom-out" onclick="generatePassword()">Generate Password</button>
    </Div>
    <script>
        function generatePassword() {
            const chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()";
            let password = "";
            for (let i = 0; i < 12; i++) {
                password += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            document.getElementById("password").value = password;
        }    </script>

        <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

        <script>
          AOS.init();
        </script>
</body>
</html>
